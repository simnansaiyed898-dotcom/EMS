<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registration System</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Event Registration System</h1><p>Manage events and participant registrations</p></header><main>
<section class="stats"><div><b id="eventCount">0</b><small>Total Events</small></div><div><b id="registrationCount">0</b><small>Registrations</small></div><div><b id="upcomingCount">0</b><small>Upcoming Events</small></div></section>
<section class="panel"><h2>Add / Edit Event</h2><form id="eventForm"><input type="hidden" id="eventId"><div class="grid"><input id="eventName" placeholder="Event name" required><input id="eventDate" type="date" required><input id="eventTime" type="time" required><input id="eventVenue" placeholder="Venue" required><input id="eventCapacity" type="number" min="1" placeholder="Capacity" required><input id="eventDescription" placeholder="Description"></div><button>Save Event</button><button type="button" id="clear">Clear</button></form></section>
<section class="panel"><div class="head"><h2>Events</h2><input id="search" placeholder="Search events..."></div><div id="events"></div></section>
<section class="panel"><h2>Register Participant</h2><form id="regForm"><div class="grid"><select id="regEvent" required></select><input id="name" placeholder="Participant name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone" required></div><button>Register</button></form></section>
<section class="panel"><h2>Registration Records</h2><div id="regs"></div></section></main><script src="script.js"></script></body></html>
